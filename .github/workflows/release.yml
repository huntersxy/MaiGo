name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本（如 1.4.5）；留空为 dev
        type: string
      publish_release:
        description: 发布为 Release 供服务器拉取
        type: boolean
        default: false

concurrency:
  group: maigo-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GO_VERSION: '1.26.5'
  DASHBOARD_VERSION: '1.10.5'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "构建版本: $version"

      # 与 Dockerfile 的 build 阶段同源：alpine + libwebp-static，产物是纯静态二进制
      - name: 编译静态二进制
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e VERSION="${{ steps.version.outputs.version }}" \
            golang:${GO_VERSION}-alpine sh -ec '
              apk add --no-cache build-base libwebp-dev libwebp-static
              go mod download
              CGO_ENABLED=1 CGO_LDFLAGS="-static -lwebp -lsharpyuv -lm" \
                go build -trimpath \
                -ldflags="-s -w -X MaiGo/internal/common/version.Build=${VERSION}" \
                -o dist/maigo .
            '

      - name: 验证二进制
        run: |
          file dist/maigo
          dist/maigo --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 组装发布包
        run: |
          version="${{ steps.version.outputs.version }}"
          stage="stage"
          mkdir -p "$stage"

          cp dist/maigo "$stage/maigo"
          echo "$version" > "$stage/VERSION"

          python -m pip install --no-cache-dir --no-deps --target "$stage/.dashboard" \
            "maibot-dashboard==${DASHBOARD_VERSION}"
          mkdir -p "$stage/dashboard"
          cp -a "$stage/.dashboard/maibot_dashboard/dist" "$stage/dashboard/dist"
          rm -rf "$stage/.dashboard"
          test -f "$stage/dashboard/dist/index.html"

          mkdir -p "$stage/pycompat-src"
          cp -a data/pycompat/src "$stage/pycompat-src/src"
          cp scripts/python_compat_sidecar.py "$stage/pycompat_sidecar.py"
          mkdir -p "$stage/desktop_pet"
          cp -a internal/desktop_pet/presets "$stage/desktop_pet/presets"
          cp deploy/host/requirements-plugin-runtime.txt deploy/host/requirements-pycompat.txt "$stage/"

          name="maigo-${version}-linux-amd64"
          tar -C "$stage" -czf "$name.tar.gz" .
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: maigo-release
          path: |
            maigo-*.tar.gz
            maigo-*.tar.gz.sha256
          retention-days: 14

      # 两条发布通道：main 推送更新滚动预发布（tag=main），打版本 tag 出正式 Release。
      # 服务器默认跟随滚动通道，版本 Release 供归档与指定版本部署。
      - name: 发布 GitHub Release
        if: github.ref_type == 'tag' || github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rolling=0
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            tag="rolling"
            rolling=1
          else
            case "$VERSION" in
              dev|'') echo "dev 构建不发布 Release" >&2; exit 1 ;;
            esac
            tag="v${VERSION}"
          fi
          notes="sha256: $(cat maigo-*.tar.gz.sha256)"$'\n'"commit: ${GITHUB_SHA}"
          if [ "$rolling" -eq 1 ]; then
            # 滚动通道每次整包替换，避免累积旧提交的资产
            gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create "$tag" --prerelease --title "滚动构建（main）" \
              --notes "$notes" maigo-*.tar.gz maigo-*.tar.gz.sha256
          elif gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" maigo-*.tar.gz maigo-*.tar.gz.sha256 --clobber
          else
            gh release create "$tag" --title "$tag" --notes "$notes" \
              maigo-*.tar.gz maigo-*.tar.gz.sha256
          fi

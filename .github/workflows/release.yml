name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 发布版本（如 1.4.5）；留空为 dev
        type: string
      publish_release:
        description: 发布为 Release 供服务器拉取
        type: boolean
        default: false

concurrency:
  group: maigo-release
  cancel-in-progress: false

permissions:
  contents: write

env:
  GO_VERSION: '1.26.5'
  DASHBOARD_VERSION: '1.10.6'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: 解析版本
        id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            # 注入版本必须是严格 semver：插件兼容校验会解析它。
            # 滚动构建的实际提交号单独写进包内 COMMIT 文件。
            version="dev"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "构建版本: $version"

      # 与 Dockerfile 的 build 阶段同源：alpine + libwebp-static，产物是纯静态二进制
      - name: 编译静态二进制
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src \
            -e VERSION="${{ steps.version.outputs.version }}" -e GITHUB_SHA \
            golang:${GO_VERSION}-alpine sh -ec '
              apk add --no-cache build-base libwebp-dev libwebp-static curl meson ninja
              sh deploy/build-rlottie.sh
              go mod download
              CGO_ENABLED=1 CGO_LDFLAGS="-static -lwebp -lsharpyuv -lm" \
                go build -tags=rlottie -trimpath \
                -ldflags="-s -w -X MaiGo/internal/common/version.Build=${VERSION} -X MaiGo/internal/common/version.revision=${GITHUB_SHA}" \
                -o dist/maigo .
              cp -a /usr/local/share/licenses/rlottie dist/rlottie-licenses
            '

      - name: 验证二进制
        run: |
          file dist/maigo
          dist/maigo --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 组装发布包
        id: package
        run: |
          version="${{ steps.version.outputs.version }}"
          stage="stage"
          mkdir -p "$stage"

          cp dist/maigo "$stage/maigo"
          cp -a dist/rlottie-licenses "$stage/rlottie-licenses"
          mkdir -p "$stage/plugin-licenses/chinese_typo"
          cp plugins/built_in/chinese_typo/{pinyin_tone3.LICENSE,typo_words.LICENSE,typo_words.NOTICE} "$stage/plugin-licenses/chinese_typo/"
          echo "$version" > "$stage/VERSION"
          echo "${GITHUB_SHA}" > "$stage/COMMIT"

          python -m pip install --no-cache-dir --no-deps --target "$stage/.dashboard" \
            "maibot-dashboard==${DASHBOARD_VERSION}"
          mkdir -p "$stage/dashboard"
          cp -a "$stage/.dashboard/maibot_dashboard/dist" "$stage/dashboard/dist"
          rm -rf "$stage/.dashboard"
          test -f "$stage/dashboard/dist/index.html"

          mkdir -p "$stage/desktop_pet"
          cp -a internal/desktop_pet/presets "$stage/desktop_pet/presets"
          cp deploy/host/requirements-plugin-runtime.txt "$stage/"

          name="maigo-${version}-linux-amd64"
          tar -C "$stage" -czf "$name.tar.gz" .
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          cat "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: maigo-release
          path: |
            maigo-*.tar.gz
            maigo-*.tar.gz.sha256
          retention-days: 14

      # main 推送整包替换 rolling 预发布，服务器据它从镜像加速下载；
      # 版本 tag 出正式 Release 供归档
      - name: 发布 GitHub Release
        if: github.ref_type == 'tag' || github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          rolling=0
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_NAME}" = "main" ]; then
            tag="rolling"
            rolling=1
          else
            case "$VERSION" in
              dev|'') echo "dev 构建不发布 Release" >&2; exit 1 ;;
            esac
            tag="v${VERSION}"
          fi
          notes="sha256: $(cat maigo-*.tar.gz.sha256)"$'\n'"commit: ${GITHUB_SHA}"
          if [ "$rolling" -eq 1 ]; then
            gh release delete "$tag" --cleanup-tag --yes >/dev/null 2>&1 || true
            gh release create "$tag" --prerelease --title "滚动构建（main）" \
              --notes "$notes" maigo-*.tar.gz maigo-*.tar.gz.sha256
          elif gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" maigo-*.tar.gz maigo-*.tar.gz.sha256 --clobber
          else
            gh release create "$tag" --title "$tag" --notes "$notes" \
              maigo-*.tar.gz maigo-*.tar.gz.sha256
          fi

  # 只发一条触发消息（提交号），发布包由服务器自己从镜像加速源拉取
  trigger:
    needs: build
    if: github.ref_name == 'main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: maigo-deploy
      cancel-in-progress: false
    steps:
      - name: 配置 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi

      # 密钥在服务器侧绑定 command=ci-trigger.sh，只接受一个提交号，拿不到 shell
      - name: 通知服务器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" \
              -o IdentitiesOnly=yes -o BatchMode=yes \
              "${DEPLOY_USER}@${DEPLOY_HOST}" "${GITHUB_SHA}"

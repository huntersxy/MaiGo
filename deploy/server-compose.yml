# 服务器部署用 compose（不带 html-render 侧车）。
#
# 与仓库根 docker-compose.yml 的差异：
#   - 不包含 html-render：它需要完整 MaiBot 运行镜像（约 2GB，含 faiss/playwright），
#     本机未部署，统计报告渲染会降级为不可用，其余功能不受影响。
#   - python-compat 使用精简镜像（python:3.13-slim + numpy/jieba/pypinyin），
#     MaiBot 原版源码以只读方式挂载到 ./maibot-src。
#
# 用法：docker compose -f server-compose.yml up -d
services:
  maigo:
    image: maigo:local
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    # 进程关停预算是 Worker 50s + Runner 15s，Docker 默认 10s 会截断落盘
    stop_grace_period: 70s
    environment:
      MAIBOT_SECRET_KEY: ${MAIBOT_SECRET_KEY:?set MAIBOT_SECRET_KEY in .env}
      MAIBOT_SERVER_PORT: ${MAIBOT_SERVER_PORT:-7468}
      MAIBOT_INSTANCE_DIR: /app
      MAIBOT_MEDIA_DIR: /app/media
      MAIBOT_STICKER_DIR: /app/stickers
      MAIBOT_LOG_LEVEL: ${MAIBOT_LOG_LEVEL:-info}
      MAIBOT_DEBUG: ${MAIBOT_DEBUG:-false}
      MAIBOT_STATISTICS_REPORT_PATH: /app/data/maibot_statistics.html
      # 错别字注入与表达向量聚类走 Python 原版侧车
      MAIBOT_COMPAT_URL: http://python-compat:8767
      MAIBOT_COMPAT_TOKEN: ${MAIBOT_COMPAT_TOKEN:-}
      MAIBOT_COMPAT_TIMEOUT: "60"
      # 插件 Python 依赖安装走国内镜像，直连 PyPI 太慢会长时间阻塞启动
      MAIBOT_PLUGIN_DEP_INDEX_URLS: ${MAIBOT_PLUGIN_DEP_INDEX_URLS:-https://mirrors.aliyun.com/pypi/simple}
      HTTP_HOST: 0.0.0.0
    depends_on:
      - python-compat
    extra_hosts:
      - host.docker.internal:host-gateway
    # 宿主机首个 DNS 会把 cnb.cool 解析成 169.254.1.44（被 SSRF 防护拦下），
    # 这里显式指定公共 DNS，避免插件市场下载失败
    dns:
      - 223.5.5.5
      - 119.29.29.29
    ports:
      - ${MAIBOT_WEB_PORT:-7468}:${MAIBOT_SERVER_PORT:-7468}
    volumes:
      - maibot-config:/app/config
      - maibot-data:/app/data
      - maibot-logs:/app/logs
      - maibot-plugins:/app/plugins
      - stickers:/app/stickers
      - media:/app/media
      # Runner venv 必须可写才能安装插件依赖
      - plugin-runtime:/app/plugin-runtime
    tmpfs:
      - /tmp
      - /app/temp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${MAIBOT_SERVER_PORT:-7468}/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 错别字（pypinyin + jieba）与表达向量聚类（numpy）直接跑 MaiBot 原版实现
  python-compat:
    image: maibot-python-compat:local
    pull_policy: never
    restart: unless-stopped
    init: true
    dns:
      - 223.5.5.5
      - 119.29.29.29
    environment:
      MAIBOT_INSTANCE_DIR: /MaiMBot
      MAIBOT_SOURCE_ROOT: /MaiMBot
      MAIBOT_COMPAT_SIDECAR_PORT: "8767"
      MAIBOT_COMPAT_SIDECAR_TOKEN: ${MAIBOT_COMPAT_TOKEN:-}
    volumes:
      - ./maibot-src:/MaiMBot/src:ro
      # typo 生成器会在 depends-data 下缓存字频表
      - maibot-compat-data:/MaiMBot/depends-data
    expose:
      - "8767"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8767), 2); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  maibot-config:
  maibot-data:
  maibot-logs:
  maibot-plugins:
  stickers:
  media:
  plugin-runtime:
  maibot-compat-data:

# 服务器部署用 compose。
#
# 用法：docker compose -f server-compose.yml up -d
services:
  maigo:
    image: maigo:local
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    # 进程关停预算是 Worker 50s + Runner 15s，Docker 默认 10s 会截断落盘
    stop_grace_period: 70s
    environment:
      MAIBOT_INSTANCE_DIR: /app
      MAIBOT_HOST_PORT: "7468"
      MAIBOT_LEGACY_0X_UPGRADE_CONFIRMED: "1"
      # 未设置时由入口脚本生成并保存到 data 卷的 .secret_key
      MAIBOT_SECRET_KEY: ${MAIBOT_SECRET_KEY:-}
      # 插件 Python 依赖安装走国内镜像，直连 PyPI 太慢会长时间阻塞启动
      MAIBOT_PLUGIN_DEP_INDEX_URLS: ${MAIBOT_PLUGIN_DEP_INDEX_URLS:-https://pypi.tuna.tsinghua.edu.cn/simple}
      HTTP_HOST: 0.0.0.0
    extra_hosts:
      - host.docker.internal:host-gateway
    # 宿主机首个 DNS 会把 cnb.cool 解析成 169.254.1.44（被 SSRF 防护拦下），
    # 这里显式指定公共 DNS，避免插件市场下载失败
    dns:
      - 223.5.5.5
      - 119.29.29.29
    ports:
      - ${MAIBOT_WEB_PORT:-7468}:7468
    volumes:
      - maibot-config:/app/config
      - maibot-data:/app/data
      - maibot-host:/app/host
      - maibot-bots:/app/bots
      - maibot-logs:/app/logs
      - maibot-plugins:/app/plugins
      - stickers:/app/stickers
      - media:/app/media
      # Runner venv 必须可写才能安装插件依赖
      - plugin-runtime:/app/plugin-runtime
    tmpfs:
      - /tmp
      - /app/temp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7468/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  maibot-config:
  maibot-data:
  maibot-host:
  maibot-bots:
  maibot-logs:
  maibot-plugins:
  stickers:
  media:
  plugin-runtime:

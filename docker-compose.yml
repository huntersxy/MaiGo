# 国内网络默认使用国内构建镜像；国外网络或镜像故障时可在 .env 覆盖
x-build-args: &maigo-build-args
  APK_MIRROR: ${MAIGO_APK_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
  PIP_INDEX_URL: ${MAIGO_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
  GOPROXY: ${MAIGO_GOPROXY:-https://goproxy.cn,direct}
  GOSUMDB: ${MAIGO_GOSUMDB:-sum.golang.google.cn}

services:
  # 平台接入走插件适配器（WebUI「适配器设置」），本体不内置协议端连接
  maigo:
    image: maigo:local
    build:
      context: .
      args: *maigo-build-args
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    # 进程关停预算是 Worker 50s + Runner 15s；Docker 默认只给 10s 就 SIGKILL，
    # 会截断正在落盘的 SQLite 与配置写回（对齐 MaiBot compose 的 70s）
    stop_grace_period: 70s
    environment:
      MAIBOT_INSTANCE_DIR: /app
      # 宿主对外 WebUI 端口；镜像内固定 7468，与端口映射和 healthcheck 一致
      MAIBOT_HOST_PORT: "7468"
      # 容器没有交互终端，旧版 0.x 配置升级需预先确认
      MAIBOT_LEGACY_0X_UPGRADE_CONFIRMED: "1"
      # 未设置时由入口脚本生成并保存到 data 卷的 .secret_key
      MAIBOT_SECRET_KEY: ${MAIBOT_SECRET_KEY:-}
      # 启用 loopback 兼容侧车；进程由 Go 首次调用时按需拉起（pypinyin / numpy）
      MAIBOT_COMPAT_URL: http://127.0.0.1:8767
      MAIBOT_COMPAT_TIMEOUT: "60"
      # 插件 Python 依赖安装走国内镜像，避免首次启用插件时长时间阻塞
      MAIBOT_PLUGIN_DEP_INDEX_URLS: ${MAIBOT_PLUGIN_DEP_INDEX_URLS:-https://pypi.tuna.tsinghua.edu.cn/simple}
      # 容器内必须监听全部网卡，否则端口映射访问不到（对齐 MaiBot compose 的 HTTP_HOST）
      HTTP_HOST: 0.0.0.0
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${MAIBOT_WEB_PORT:-7468}:7468
    volumes:
      - maibot-config:/app/config
      - maibot-data:/app/data
      - maibot-host:/app/host
      - maibot-bots:/app/bots
      - maibot-logs:/app/logs
      - maibot-plugins:/app/plugins
      - stickers:/app/stickers
      - media:/app/media
      # Runner venv 必须可写才能安装插件依赖
      - plugin-runtime:/app/plugin-runtime
      # typo 生成器会在 depends-data 下缓存字频表
      - maibot-compat-data:/app/depends-data
    tmpfs:
      - /tmp
      # Runner 的非持久运行时目录（Python build_plugin_paths 会写 temp/plugins）
      - /app/temp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7468/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Python 原版能力侧车不是独立服务：Go 在主容器内按需拉起
  # /app/pycompat_sidecar.py，只加载 data/pycompat 里 vendored 的两个模块。

volumes:
  maibot-config:
  maibot-data:
  maibot-host:
  maibot-bots:
  maibot-logs:
  maibot-plugins:
  maibot-compat-data:
  stickers:
  media:
  plugin-runtime:

services:
  # 平台接入走插件适配器（WebUI「适配器设置」），本体不内置协议端连接
  maibot-go:
    image: maibot-go:local
    build: .
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    # 进程关停预算是 Worker 50s + Runner 15s；Docker 默认只给 10s 就 SIGKILL，
    # 会截断正在落盘的 SQLite 与配置写回（对齐 MaiBot compose 的 70s）
    stop_grace_period: 70s
    environment:
      MAIBOT_SECRET_KEY: ${MAIBOT_SECRET_KEY:?set MAIBOT_SECRET_KEY in .env}
      MAIBOT_SERVER_PORT: ${MAIBOT_SERVER_PORT:-7468}
      MAIBOT_INSTANCE_DIR: /app
      MAIBOT_MEDIA_DIR: /app/media
      MAIBOT_STICKER_DIR: /app/stickers
      MAIBOT_LOG_LEVEL: ${MAIBOT_LOG_LEVEL:-info}
      MAIBOT_DEBUG: ${MAIBOT_DEBUG:-false}
      MAIBOT_STATISTICS_REPORT_PATH: /app/data/maibot_statistics.html
      # HTML→PNG 统一委托 Python 原版 Playwright 侧车，Go 侧不再维护 CDP 实现
      MAIBOT_HTMLRENDER_URL: http://html-render:8766/render
      MAIBOT_HTMLRENDER_TOKEN: ${MAIBOT_HTMLRENDER_TOKEN:-}
      # 首次渲染可能触发 Playwright 下载 Chromium，给足侧车等待时间
      MAIBOT_HTMLRENDER_TIMEOUT: "240"
      # 错别字注入与表达向量聚类委托 Python 原版侧车（pypinyin / numpy）
      MAIBOT_COMPAT_URL: http://python-compat:8767
      MAIBOT_COMPAT_TOKEN: ${MAIBOT_COMPAT_TOKEN:-}
      MAIBOT_COMPAT_TIMEOUT: "60"
      # 容器内必须监听全部网卡，否则端口映射访问不到（对齐 MaiBot compose 的 HTTP_HOST）
      HTTP_HOST: 0.0.0.0
    depends_on:
      - html-render
      - python-compat
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${MAIBOT_WEB_PORT:-7468}:${MAIBOT_SERVER_PORT:-7468}
    volumes:
      - maibot-config:/app/config
      - maibot-data:/app/data
      - maibot-logs:/app/logs
      - maibot-plugins:/app/plugins
      - stickers:/app/stickers
      - media:/app/media
    tmpfs:
      - /tmp
      # Runner 的非持久运行时目录（Python build_plugin_paths 会写 temp/plugins）
      - /app/temp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${MAIBOT_SERVER_PORT:-7468}/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 直接复用 Python 原版 MaiBot 镜像里的 Playwright 渲染服务，不维护 Go CDP 实现
  html-render:
    image: maibot-html-render:local
    build:
      context: ../MaiBot
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    entrypoint: ["/MaiMBot/.venv/bin/python", "/MaiMBot/html_render_sidecar.py"]
    working_dir: /MaiMBot
    environment:
      MAIBOT_INSTANCE_DIR: /MaiMBot
      MAIBOT_INITIALIZE_ONLY: "1"
      MAIBOT_HTMLRENDER_SIDECAR_PORT: "8766"
      MAIBOT_HTMLRENDER_SIDECAR_TOKEN: ${MAIBOT_HTMLRENDER_TOKEN:-}
      MAIBOT_HTMLRENDER_SIDECAR_TIMEOUT: "240"
      MAIBOT_HTMLRENDER_BROWSER_INSTALL_ROOT: /MaiMBot/data/playwright-browsers
      MAIBOT_HTMLRENDER_BROWSER_PATH: ${MAIBOT_HTMLRENDER_BROWSER_PATH:-}
      MAIBOT_HTMLRENDER_BROWSER_WS: ${MAIBOT_HTMLRENDER_BROWSER_WS:-}
      MAIBOT_HTMLRENDER_AUTO_DOWNLOAD: "true"
    volumes:
      - ./scripts/html_render_sidecar.py:/MaiMBot/html_render_sidecar.py:ro
      - maibot-render-data:/MaiMBot/data
    expose:
      - "8766"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8766), 2); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  # Python 原版能力侧车：错别字生成（pypinyin + jieba）与表达向量聚类（numpy）
  # 直接跑 MaiBot 的 typo_generator.py / expression_vector_index.py，
  # 避免 Go 侧继续逐位复刻 numpy PCG64 与拼音表。
  python-compat:
    image: maibot-html-render:local
    build:
      context: ../MaiBot
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    entrypoint: ["/MaiMBot/.venv/bin/python", "/MaiMBot/python_compat_sidecar.py"]
    working_dir: /MaiMBot
    environment:
      MAIBOT_INSTANCE_DIR: /MaiMBot
      MAIBOT_SOURCE_ROOT: /MaiMBot
      MAIBOT_COMPAT_SIDECAR_PORT: "8767"
      MAIBOT_COMPAT_SIDECAR_TOKEN: ${MAIBOT_COMPAT_TOKEN:-}
    volumes:
      - ./scripts/python_compat_sidecar.py:/MaiMBot/python_compat_sidecar.py:ro
      # MaiBot 的 typo 生成器会在 depends-data 下缓存字频表
      - maibot-compat-data:/MaiMBot/depends-data
    expose:
      - "8767"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8767), 2); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  maibot-config:
  maibot-data:
  maibot-logs:
  maibot-plugins:
  maibot-render-data:
  maibot-compat-data:
  stickers:
  media:

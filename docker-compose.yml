services:
  # 平台接入走插件适配器（WebUI「适配器设置」），本体不内置协议端连接
  maigo:
    image: maigo:local
    build: .
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    # 进程关停预算是 Worker 50s + Runner 15s；Docker 默认只给 10s 就 SIGKILL，
    # 会截断正在落盘的 SQLite 与配置写回（对齐 MaiBot compose 的 70s）
    stop_grace_period: 70s
    environment:
      MAIBOT_SECRET_KEY: ${MAIBOT_SECRET_KEY:?set MAIBOT_SECRET_KEY in .env}
      MAIBOT_SERVER_PORT: ${MAIBOT_SERVER_PORT:-7468}
      MAIBOT_INSTANCE_DIR: /app
      MAIBOT_MEDIA_DIR: /app/media
      MAIBOT_STICKER_DIR: /app/stickers
      MAIBOT_LOG_LEVEL: ${MAIBOT_LOG_LEVEL:-info}
      MAIBOT_DEBUG: ${MAIBOT_DEBUG:-false}
      MAIBOT_STATISTICS_REPORT_PATH: /app/data/maibot_statistics.html
      MAIBOT_HTMLRENDER_URL: "${MAIBOT_HTMLRENDER_URL:-}"
      MAIBOT_HTMLRENDER_TOKEN: "${MAIBOT_HTMLRENDER_TOKEN:-}"
      MAIBOT_HTMLRENDER_TIMEOUT: ${MAIBOT_HTMLRENDER_TIMEOUT:-30}
      # 错别字注入与表达向量聚类委托 Python 原版侧车（pypinyin / numpy）
      MAIBOT_COMPAT_URL: http://python-compat:8767
      MAIBOT_COMPAT_TOKEN: ${MAIBOT_COMPAT_TOKEN:-}
      MAIBOT_COMPAT_TIMEOUT: "60"
      # 容器内必须监听全部网卡，否则端口映射访问不到（对齐 MaiBot compose 的 HTTP_HOST）
      HTTP_HOST: 0.0.0.0
    depends_on:
      - python-compat
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - ${MAIBOT_WEB_PORT:-7468}:${MAIBOT_SERVER_PORT:-7468}
    volumes:
      - maibot-config:/app/config
      - maibot-data:/app/data
      - maibot-logs:/app/logs
      - maibot-plugins:/app/plugins
      - stickers:/app/stickers
      - media:/app/media
      # Runner venv 必须可写才能安装插件依赖
      - plugin-runtime:/app/plugin-runtime
    tmpfs:
      - /tmp
      # Runner 的非持久运行时目录（Python build_plugin_paths 会写 temp/plugins）
      - /app/temp
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${MAIBOT_SERVER_PORT:-7468}/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Python 原版能力侧车：错别字生成（pypinyin + jieba）与表达向量聚类（numpy）
  python-compat:
    image: maigo:local
    build: .
    pull_policy: never
    restart: unless-stopped
    init: true
    read_only: true
    entrypoint: ["/app/pycompat/bin/python", "/app/pycompat_sidecar.py"]
    user: maibot
    environment:
      MAIBOT_INSTANCE_DIR: /app
      MAIBOT_SOURCE_ROOT: /app/pycompat-src
      MAIBOT_COMPAT_SIDECAR_PORT: "8767"
      MAIBOT_COMPAT_SIDECAR_TOKEN: ${MAIBOT_COMPAT_TOKEN:-}
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      # MaiBot 的 typo 生成器会在 depends-data 下缓存字频表
      - maibot-compat-data:/app/depends-data
    tmpfs:
      - /tmp
    expose:
      - "8767"
    healthcheck:
      test: ["CMD-SHELL", "/app/pycompat/bin/python -c \"import socket; s=socket.create_connection(('127.0.0.1', 8767), 2); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  maibot-config:
  maibot-data:
  maibot-logs:
  maibot-plugins:
  maibot-compat-data:
  stickers:
  media:
  plugin-runtime:

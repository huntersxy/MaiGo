[web]
preview_chars = 4000
services = {}

[[models]]
model_type = "llm"
model_identifier = "deepseek-v4-pro"
name = "deepseek-v4-pro-think"
api_provider = "DeepSeek"
price_in = 12.0
price_out = 24.0
price_periods = []
send_temperature = true
visual = false
max_images = 0
image_max_side = 8000
image_min_side = 1
extra_params = { thinking = { type = "enabled" }, reasoning_effort = "high" }

[[models]]
